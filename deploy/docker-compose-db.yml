services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: maindb
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-aircount}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-aircount}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse/storage.xml:/etc/clickhouse-server/config.d/storage.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  clickhouse_data:
  clickhouse_logs:
