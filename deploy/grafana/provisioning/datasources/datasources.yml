apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    jsonData:
      host: $CLICKHOUSE_HOST
      port: 9000
      protocol: native
      username: $CLICKHOUSE_USER
      defaultDatabase: $CLICKHOUSE_DATABASE
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
  
  - name: PostgreSQL
    uid: postgres
    type: grafana-postgresql-datasource
    url: ${POSTGRES_HOST}:${POSTGRES_PORT}
    user: $POSTGRES_GRAFANA_USER
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      maxOpenConns: 5
    secureJsonData:
      password: $POSTGRES_GRAFANA_PASSWORD
