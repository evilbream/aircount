services:
  prometheus:
    image: prom/prometheus:latest
    container_name: aircount-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=5d
      - --web.enable-lifecycle        # change yml file: curl -X POST localhost:9090/-/reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: aircount-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-aircount}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-aircount}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-maindb}
      HTTPS_PROXY: ${TG_PROXY:-}
      NO_PROXY: ${GRAFANA_NO_PROXY:-prometheus,localhost,127.0.0.1,192.168.0.0/16}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana


volumes:
  prometheus_data:
  grafana_data:
